<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EV Charge · Tìm trạm sạc</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{
  --bg:#f0f4fa;--card:#fff;--ink:#17243a;--muted:#718096;--line:#e5ebf3;
  --blue:#2563eb;--green:#0b9b70;--red:#d14343;--header:#101d35;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}

/* Header gọn */
header{background:var(--header);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
.brand{font-weight:800;font-size:17px}.brand span{color:#64d6b0}
.sub{color:#b8c5d9;font-size:11px}

/* Thanh điều khiển */
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;flex-shrink:0}
.toolbar h1{font-size:15px;margin:0;font-weight:700}
.connection{font-size:11px;padding:4px 9px;border-radius:999px;background:#f3f6fb;border:1px solid var(--line);font-weight:600}
.btn{border:0;border-radius:8px;background:var(--blue);color:#fff;padding:6px 11px;font-weight:700;cursor:pointer;font-size:12px}
.btn.secondary{background:#eaf0fa;color:#23436e}
.btn.outline{background:#fff;border:1px solid var(--line);color:#23436e}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:5px 9px;font-size:11px}
.btn.danger{background:#d14343;color:#fff}
.gps-status{font-size:11px;color:var(--muted)}
.gps-status.on{color:#087a56;font-weight:600}

/* Layout chính: list | map  – chiếm hết chiều cao còn lại */
.main{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0;overflow:hidden}

/* Panel danh sách */
.list-panel{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.panelhead{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;gap:8px}
.panelhead .head-actions{display:flex;gap:6px;align-items:center}
.search-box{padding:8px 10px;border-bottom:1px solid var(--line);flex-shrink:0}
.search-box input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;outline:none}
.search-box input:focus{border-color:#8db3ff}
.station-list{flex:1;overflow:auto;padding:8px;display:grid;gap:7px;align-content:start}
.station{border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:#fff;transition:border-color .12s,background .12s}
.station:hover,.station.active{border-color:#8db3ff;background:#f5f9ff}
.stationtop{display:flex;justify-content:space-between;gap:6px;align-items:center}
.stationname{font-weight:700;font-size:13px}
.pill{font-size:10px;font-weight:700;border-radius:999px;padding:2px 7px;white-space:nowrap;background:#edf1f6;color:#596579}
.pill.available{background:#e4f7ef;color:#087a56}
.pill.charging{background:#e7efff;color:#2457bb}
.pill.fault,.pill.offline{background:#ffeded;color:#b83232}
.pill.unknown{background:#eef1f5;color:#68758a}
.small{font-size:11px;color:var(--muted);margin-top:3px}
.meta{display:flex;gap:10px;margin-top:5px;font-size:11px;color:#536177;flex-wrap:wrap}
.empty{padding:18px;color:var(--muted);text-align:center;font-size:12px}

/* Map panel */
.map-panel{position:relative;min-height:0;display:flex;flex-direction:column;background:#e8eef5}
#map{flex:1;width:100%;min-height:0}
.map-fallback{padding:24px;color:#52627a;font-size:13px;text-align:center}
.legend{display:flex;gap:10px;flex-wrap:wrap;padding:6px 12px;background:#fff;border-top:1px solid var(--line);font-size:11px;color:var(--muted);flex-shrink:0}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:middle}
.dot.green{background:#0b9b70}.dot.blue{background:#3478e5}.dot.red{background:#d14343}.dot.grey{background:#8a96a8}

/* Thẻ chi tiết nổi trên bản đồ – không đẩy layout */
.detail-card{
  position:absolute;left:12px;right:12px;bottom:12px;z-index:10;
  background:#fff;border-radius:14px;box-shadow:0 8px 28px #0f1c3528;
  border:1px solid var(--line);padding:12px 14px;
  max-height:48%;overflow:auto;
  transform:translateY(110%);opacity:0;pointer-events:none;
  transition:transform .25s ease,opacity .2s ease;
}
.detail-card.show{transform:translateY(0);opacity:1;pointer-events:auto}
.detail-card .close-btn{
  position:absolute;top:8px;right:10px;border:0;background:#f0f4fa;
  width:28px;height:28px;border-radius:50%;font-size:16px;cursor:pointer;color:#52627a;line-height:1;
}
.detail-card h3{margin:0 28px 6px 0;font-size:14px;font-weight:750}
.detail-card .code{font-size:11px;color:var(--muted);font-weight:500}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.dmetric{background:#f4f7fc;border-radius:8px;padding:7px 6px;text-align:center}
.dmetric b{display:block;font-size:12px;line-height:1.2}
.dmetric span{font-size:10px;color:var(--muted)}
.price-now{display:flex;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(135deg,#eef6ff,#f5faf7);border:1px solid #d6e8f7;border-radius:10px;padding:9px 12px;margin-bottom:8px}
.price-now .label{font-size:11px;color:var(--muted)}
.price-now .val{font-size:18px;font-weight:800;color:#1d4ed8;letter-spacing:-.3px}
.price-now .tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:#e7efff;color:#2457bb}
.price-now .tag.low{background:#e4f7ef;color:#087a56}
.price-now .tag.peak{background:#fff3e0;color:#b7791f}
.tariff-toggle{font-size:11px;color:var(--blue);cursor:pointer;background:none;border:0;padding:0;font-weight:600;margin-bottom:6px}
.tariff-panel{display:none;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}
.tariff-panel.open{display:grid}
.price-item{background:#f7f9fc;border-radius:7px;padding:6px 4px;text-align:center}
.price-item span{display:block;font-size:9px;color:var(--muted)}
.price-item b{display:block;font-size:11px;margin-top:1px}
.route-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.segment{display:flex;background:#f0f4fa;padding:2px;border-radius:8px;gap:2px}
.segment button{border:0;background:transparent;padding:5px 10px;border-radius:6px;color:#52627a;font-weight:700;cursor:pointer;font-size:11px}
.segment button.active{background:#fff;color:#1d4ed8;box-shadow:0 1px 3px #14213d15}
.routeinfo{font-size:11px;color:#3d4f6a}
.routeinfo b{color:var(--ink)}
.act-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.notice{font-size:11px;color:#66758b;margin-top:6px;padding:6px 8px;background:#f4f7fb;border-radius:7px}
.queue-box{margin:8px 0;padding:10px;border-radius:10px;background:#f0f7ff;border:1px solid #cfe0f5}
.queue-box .qtitle{font-size:12px;font-weight:700;margin-bottom:6px;color:#1e40af}
.queue-box .qrow{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin:3px 0}
.queue-box .qstatus{font-weight:700}
.queue-box .qstatus.waiting{color:#1d4ed8}
.queue-box .qstatus.called{color:#b7791f}
.queue-box .qstatus.serving{color:#087a56}
.queue-box .qstatus.cancelled,.queue-box .qstatus.completed{color:#68758a}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#101d35;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#9b2c2c}
.maplibregl-popup-content{padding:9px 11px;border-radius:9px;font-size:12px}
.popname{font-weight:800;margin-bottom:2px}
.popstatus{font-size:11px;color:#58677d}

/* Mobile */
@media(max-width:780px){
  body{overflow:auto}
  .main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .list-panel{order:2;max-height:34vh;border-right:0;border-top:1px solid var(--line)}
  .map-panel{order:1;min-height:48vh}
  .detail-card{max-height:55%;left:8px;right:8px;bottom:8px}
  .dgrid{grid-template-columns:1fr 1fr}
  .act-row{grid-template-columns:1fr 1fr}
  .toolbar h1{display:none}
}
</style>
</head>
<body>
<header>
  <div>
    <div class="brand">EV <span>CHARGE</span></div>
    <div class="sub">ĐỒ ÁN 08 · UTE · V4.1</div>
  </div>
  <div class="sub">Tìm trạm sạc · Thông tin công khai</div>
</header>

<div class="toolbar">
  <h1>Trạm sạc gần bạn</h1>
  <span id="apiState" class="connection">Đang kết nối…</span>
  <button id="locateBtn" class="btn secondary sm">◎ Vị trí</button>
  <button id="watchBtn" class="btn outline sm">Theo dõi GPS</button>
  <button id="refreshBtn" class="btn sm">Làm mới</button>
  <span id="gpsStatus" class="gps-status">GPS tắt</span>
</div>

<div class="main">
  <!-- Danh sách trạm -->
  <aside class="list-panel">
    <div class="panelhead">
      <span>Danh sách</span>
      <div class="head-actions">
        <span id="count" style="font-size:11px;color:var(--muted)">—</span>
        <button id="overviewBtn" class="btn outline sm" title="Xem toàn bộ bản đồ">Overview</button>
      </div>
    </div>
    <div class="search-box">
      <input id="searchInput" type="search" placeholder="Tìm theo tên hoặc mã trạm…" autocomplete="off">
    </div>
    <div id="stationList" class="station-list">
      <div class="empty">Đang tải dữ liệu trạm…</div>
    </div>
  </aside>

  <!-- Bản đồ + thẻ chi tiết nổi -->
  <section class="map-panel">
    <div id="map"><div class="map-fallback">Đang tải bản đồ…</div></div>
    <div class="legend">
      <span><i class="dot green"></i>Sẵn sàng</span>
      <span><i class="dot blue"></i>Đang sạc</span>
      <span><i class="dot red"></i>Lỗi / Offline</span>
      <span><i class="dot grey"></i>Chưa rõ</span>
      <span>◎ Bạn</span>
    </div>

    <!-- Thẻ chi tiết trạm – nổi trên map, không cuộn trang -->
    <div id="detailCard" class="detail-card">
      <button class="close-btn" onclick="closeDetail()" title="Đóng">×</button>
      <div id="detailBody"></div>
    </div>
  </section>
</div>

<div id="toast" class="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* ========== CONFIG ========== */
// API Node-RED trên Render. Có thể ghi đè bằng ?api=https://... hoặc localStorage.ev_api_base
(function resolveApiBase() {
  try {
    const q = new URLSearchParams(location.search).get('api');
    if (q && /^https?:\/\//i.test(q)) {
      localStorage.setItem('ev_api_base', q.replace(/\/+$/, ''));
    }
  } catch (_) {}
})();
const API_BASE = (localStorage.getItem('ev_api_base') || 'https://detaiso8.onrender.com').replace(/\/+$/, '');
const API_URL  = API_BASE + '/api/user/stations';
const MAP_STYLE = 'https://tiles.openfreemap.org/styles/liberty';
const OSRM_BASE = 'https://router.project-osrm.org';
const REFRESH_MS = 15000;
const QUEUE_POLL_MS = 12000;
const ROUTE_MIN_DIST_M = 80;
const ROUTE_MIN_INTERVAL_MS = 15000;
const GUEST_KEY = 'ev_guest_id';
const QUEUE_KEY = 'ev_my_queues';

const TEMP_COORDS = {
  1: { lat: 10.849900, lng: 106.771700, label: 'Cổng Võ Văn Ngân · HCM-UTE', temporary: true },
  2: { lat: 10.881808, lng: 106.782464, label: 'Cổng chính KTX Khu B · ĐHQG-HCM', temporary: true }
};

/* ========== STATE ========== */
let stations = [];
let selectedId = null;
let map = null;
let mapReady = false;
let markers = {};
let userMarker = null;
let userPos = null;
let lastRoutePos = null;
let lastRouteTs = 0;
let watchId = null;
let watching = false;
let routeMode = 'driving';
let currentRoute = null;
let searchQuery = '';
let myQueues = loadMyQueues(); // { [stationId]: { queueId, status, position, ... } }
let queuePollTimer = null;

const $ = id => document.getElementById(id);

/* ========== GUEST ID ========== */
function getGuestId() {
  let id = localStorage.getItem(GUEST_KEY);
  if (!id || !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id)) {
    id = (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      const v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    }));
    localStorage.setItem(GUEST_KEY, id);
  }
  return id;
}

function loadMyQueues() {
  try {
    const raw = localStorage.getItem(QUEUE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (_) { return {}; }
}

function saveMyQueues() {
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(myQueues)); } catch (_) {}
}

function setMyQueue(stationId, data) {
  if (!data) {
    delete myQueues[String(stationId)];
  } else {
    myQueues[String(stationId)] = data;
  }
  saveMyQueues();
}

/* ========== HELPERS ========== */
function escapeHtml(v) {
  return String(v ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function statusInfo(s) {
  const conn = String(s.connectionStatus || s.connection_status || '').toUpperCase();
  const v = String(s.status || s.operatingStatus || s.operating_status || 'UNKNOWN').toUpperCase();
  if (conn === 'OFFLINE' || v === 'OFFLINE') return ['Ngoại tuyến', 'offline'];
  if (v === 'AVAILABLE') return ['Sẵn sàng', 'available'];
  if (v === 'CHARGING')  return ['Đang có xe sạc', 'charging'];
  if (v === 'FAULT')     return ['Đang gặp lỗi', 'fault'];
  return ['Chưa có dữ liệu', 'unknown'];
}
function safeStatus(s) {
  const conn = String(s.connectionStatus || s.connection_status || '').toUpperCase();
  if (conn === 'OFFLINE') return 'OFFLINE';
  return String(s.status || s.operatingStatus || s.operating_status || 'UNKNOWN').toUpperCase();
}
function hasActiveQueue(q) {
  return !!q && ['WAITING', 'CALLED', 'SERVING'].includes(String(q.status || '').toUpperCase());
}
function queueRecordFromResponse(d) {
  const item = d?.entry || d?.queue || d?.data?.entry || d?.data?.queue || d?.data || d || {};
  return {
    queueId: item.queueId || item.queue_id || item.entryId || item.entry_id || item.id ||
             d?.queueId || d?.queue_id || d?.entryId || d?.entry_id || null,
    status: item.status || d?.status || null,
    position: item.position ?? item.queuePosition ?? item.queue_position ??
              d?.position ?? d?.queuePosition ?? d?.queue_position ?? null
  };
}
function coordsOf(s) {
  const lat = Number(s.latitude ?? s.lat);
  const lng = Number(s.longitude ?? s.lng);
  if (Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180)
    return { lat, lng, temporary: false, label: null };
  return TEMP_COORDS[Number(s.id)] || null;
}
function money(v) {
  return Number(v) > 0 ? Number(v).toLocaleString('vi-VN') + ' ₫' : '—';
}
function currentTariff(t) {
  if (!t) return { price: null, label: 'Chưa có giá', tagClass: '' };
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  const parse = (s, def) => {
    if (!s || typeof s !== 'string') return def;
    const [h, m] = s.split(':').map(Number);
    return (Number.isFinite(h) ? h : 0) * 60 + (Number.isFinite(m) ? m : 0);
  };
  const lowStart  = parse(t.lowStart, 0);
  const lowEnd    = parse(t.lowEnd, 6 * 60);
  const peakStart = parse(t.peakStart, 17 * 60 + 30);
  const peakEnd   = parse(t.peakEnd, 22 * 60 + 30);
  const inRange = (start, end) => {
    if (start <= end) return mins >= start && mins < end;
    return mins >= start || mins < end;
  };
  if (Number(t.low) > 0 && inRange(lowStart, lowEnd)) {
    return { price: Number(t.low), label: 'Thấp điểm', tagClass: 'low' };
  }
  if (Number(t.peak) > 0 && inRange(peakStart, peakEnd)) {
    return { price: Number(t.peak), label: 'Cao điểm', tagClass: 'peak' };
  }
  if (Number(t.normal) > 0) {
    return { price: Number(t.normal), label: 'Bình thường', tagClass: '' };
  }
  const any = Number(t.low) || Number(t.normal) || Number(t.peak) || null;
  return { price: any, label: any ? 'Hiện tại' : 'Chưa có giá', tagClass: '' };
}
function haversineM(lat1, lng1, lat2, lng2) {
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function formatDistance(m) {
  if (!Number.isFinite(m)) return '—';
  return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(1) + ' km';
}
function formatDuration(s) {
  if (s < 60) return Math.round(s) + ' giây';
  const min = Math.round(s / 60);
  if (min < 60) return min + ' phút';
  return Math.floor(min / 60) + ' giờ ' + (min % 60 ? (min % 60) + ' phút' : '');
}
function queueStatusLabel(st) {
  const v = String(st || '').toUpperCase();
  if (v === 'WAITING') return 'Đang chờ';
  if (v === 'CALLED') return 'Được gọi vào sạc';
  if (v === 'SERVING') return 'Đang được phục vụ';
  if (v === 'COMPLETED') return 'Hoàn tất';
  if (v === 'CANCELLED') return 'Đã hủy';
  return v || '—';
}
function showToast(msg, isError) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.toggle('err', !!isError);
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove('show'), 3200);
}

/* ========== API ========== */
async function loadStations() {
  $('apiState').textContent = 'Đang tải…';
  $('apiState').style.color = '';
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 15000);
    const r = await fetch(API_URL, {
      headers: { 'Accept': 'application/json' },
      cache: 'no-store',
      signal: ctrl.signal,
      mode: 'cors'
    });
    clearTimeout(t);
    if (!r.ok) {
      let detail = 'HTTP ' + r.status;
      try {
        const errBody = await r.json();
        if (errBody && (errBody.message || errBody.error)) {
          detail += ' · ' + (errBody.message || errBody.error);
        }
      } catch (_) {}
      throw new Error(detail);
    }
    const data = await r.json();
    stations = Array.isArray(data) ? data : (data.stations || []);
    $('apiState').textContent = 'API OK · ' + stations.length + ' trạm';
    $('apiState').style.color = '#087a56';
    renderList();
    updateMarkers();
    if (selectedId !== null) {
      const s = stations.find(x => Number(x.id) === Number(selectedId));
      if (s) showDetail(s);
    }
  } catch (e) {
    let msg = e.name === 'AbortError' ? 'Timeout / API chậm (Render có thể đang ngủ)' : String(e.message || e);
    // Failed to fetch thường = CORS, HTTPS/HTTP mixed, hoặc server down
    if (/failed to fetch|networkerror|load failed/i.test(msg)) {
      msg = 'Không kết nối được API (CORS / mạng / server ngủ).\nAPI: ' + API_URL +
            '\nMở web tại https://detaiso8-1.onrender.com hoặc đợi Node-RED Render thức dậy.';
    }
    $('apiState').textContent = 'Lỗi API';
    $('apiState').style.color = '#b83232';
    $('stationList').innerHTML = `<div class="empty">Không tải được API<br><small style="white-space:pre-wrap">${escapeHtml(msg)}</small></div>`;
    console.error('[EV] loadStations failed', API_URL, e);
  }
}

/* ========== LIST ========== */
function getSortedStations() {
  let list = stations.slice();
  const q = searchQuery.trim().toLowerCase();
  if (q) {
    list = list.filter(s => {
      const name = String(s.name || '').toLowerCase();
      const code = String(s.code || '').toLowerCase();
      return name.includes(q) || code.includes(q) || String(s.id).includes(q);
    });
  }
  if (userPos) {
    list.forEach(s => {
      const c = coordsOf(s);
      s._dist = c ? haversineM(userPos.lat, userPos.lng, c.lat, c.lng) : Infinity;
    });
    list.sort((a, b) => (a._dist || Infinity) - (b._dist || Infinity));
  }
  return list;
}

function renderList() {
  const list = getSortedStations();
  $('count').textContent = list.length + ' trạm';
  if (!list.length) {
    $('stationList').innerHTML = '<div class="empty">' + (searchQuery ? 'Không tìm thấy trạm.' : 'Chưa có trạm.') + '</div>';
    return;
  }
  $('stationList').innerHTML = list.map(s => {
    const [label, cls] = statusInfo(s);
    const c = coordsOf(s);
    const cur = currentTariff(s.tariff || {});
    const priceShort = cur.price != null ? Number(cur.price).toLocaleString('vi-VN') + ' ₫' : '—';
    const dist = (userPos && Number.isFinite(s._dist)) ? formatDistance(s._dist) : null;
    const mine = myQueues[String(s.id)];
    return `<article class="station ${Number(selectedId) === Number(s.id) ? 'active' : ''}" onclick="selectStation(${Number(s.id)})">
      <div class="stationtop">
        <span class="stationname">${escapeHtml(s.name || 'Trạm sạc')}</span>
        <span class="pill ${cls}">${label}</span>
      </div>
      <div class="small">${escapeHtml(s.code || '')}${c ? (c.label ? ' · ' + escapeHtml(c.label) : '') : ' · Chưa có tọa độ'}${dist ? ' · ' + dist : ''}</div>
      <div class="meta">
        <span>${Number(s.queueCount ?? s.queue_count) || 0} chờ</span>
        <span>${Number(s.estimatedWaitMinutes ?? s.estimated_wait_minutes) || 0} phút</span>
        <span>${priceShort}/kWh</span>
        ${mine ? `<span style="color:#1d4ed8;font-weight:700">Bạn: ${queueStatusLabel(mine.status)}</span>` : ''}
      </div>
    </article>`;
  }).join('');
}

/* ========== DETAIL CARD ========== */
function showDetail(s) {
  const [label] = statusInfo(s);
  const t = s.tariff || {};
  const st = safeStatus(s);
  const c = coordsOf(s);
  const q = Number(s.queueCount ?? s.queue_count) || 0;
  const w = Number(s.estimatedWaitMinutes ?? s.estimated_wait_minutes) || 0;
  const cur = currentTariff(t);
  const priceText = cur.price != null ? Number(cur.price).toLocaleString('vi-VN') + ' ₫/kWh' : 'Chưa cập nhật';
  const power = (s.power_kw != null || s.power != null) ? Number(s.power_kw ?? s.power) : null;
  const updated = s.updatedAt ? new Date(s.updatedAt).toLocaleString('vi-VN') : 'Chưa cập nhật';
  const mine = myQueues[String(s.id)];
  const activeMine = hasActiveQueue(mine);
  const canJoin = ['AVAILABLE', 'CHARGING'].includes(st) && !activeMine;
  const canCancel = mine && ['WAITING', 'CALLED'].includes(String(mine.status || '').toUpperCase());

  let html = `
    <h3>${escapeHtml(s.name || 'Trạm sạc')} <span class="code">${escapeHtml(s.code || '')}</span></h3>
    <div class="dgrid">
      <div class="dmetric"><b>${label}</b><span>Trạng thái</span></div>
      <div class="dmetric"><b>${q} lượt</b><span>Hàng chờ</span></div>
      <div class="dmetric"><b>${w} phút</b><span>Chờ dự kiến</span></div>
      <div class="dmetric"><b>${power != null && Number.isFinite(power) ? power.toFixed(1) + ' kW' : 'Chưa cập nhật'}</b><span>Công suất</span></div>
    </div>
    <div class="price-now">
      <div>
        <div class="label">Giá sạc lúc này</div>
        <div class="val">${priceText}</div>
      </div>
      <span class="tag ${cur.tagClass}">${escapeHtml(cur.label)}</span>
    </div>
    <button type="button" class="tariff-toggle" onclick="this.nextElementSibling.classList.toggle('open');this.textContent=this.nextElementSibling.classList.contains('open')?'Ẩn biểu giá':'Xem biểu giá đầy đủ'">Xem biểu giá đầy đủ</button>
    <div class="tariff-panel">
      <div class="price-item"><span>Thấp điểm ${escapeHtml(t.lowStart || '00:00')}–${escapeHtml(t.lowEnd || '06:00')}</span><b>${money(t.low)}</b></div>
      <div class="price-item"><span>Bình thường</span><b>${money(t.normal)}</b></div>
      <div class="price-item"><span>Cao điểm ${escapeHtml(t.peakStart || '17:30')}–${escapeHtml(t.peakEnd || '22:30')}</span><b>${money(t.peak)}</b></div>
    </div>`;

  // Hàng chờ của tôi
  if (mine) {
    const qs = String(mine.status || 'WAITING').toUpperCase();
    html += `<div class="queue-box">
      <div class="qtitle">Lượt chờ của bạn</div>
      <div class="qrow"><span>Trạng thái</span><span class="qstatus ${qs.toLowerCase()}">${escapeHtml(queueStatusLabel(qs))}</span></div>
      <div class="qrow"><span>Vị trí</span><span>${mine.position != null ? '#' + mine.position : (qs === 'CALLED' || qs === 'SERVING' ? 'Đến lượt bạn' : 'Đang cập nhật')}</span></div>
      <div class="qrow"><span>Mã lượt</span><span style="font-size:10px;word-break:break-all">${escapeHtml(mine.queueId || '—')}</span></div>
      ${canCancel ? `<button class="btn danger sm" style="width:100%;margin-top:8px" onclick="cancelQueue(${Number(s.id)})">Hủy lượt chờ</button>` : ''}
    </div>`;
  }

  html += `
    <div class="route-row">
      <div class="segment">
        <button class="${routeMode === 'driving' ? 'active' : ''}" onclick="setRouteMode('driving')">🚗 Ô tô</button>
        <button class="${routeMode === 'bike' ? 'active' : ''}" onclick="setRouteMode('bike')">🏍 Xe máy</button>
      </div>
      <span id="routeInfo" class="routeinfo"></span>
    </div>
    <div class="act-row">
      <button class="btn sm" onclick="requestRoute(${Number(s.id)})">Tính đường</button>
      <button class="btn outline sm" onclick="openGoogleMaps(${Number(s.id)})">Google Maps</button>
      ${canJoin
        ? `<button class="btn secondary sm" onclick="joinQueue(${Number(s.id)})">＋ Hàng chờ</button>`
        : mine
          ? `<button class="btn secondary sm" disabled>Đã đăng ký</button>`
          : `<button class="btn secondary sm" disabled>Không khả dụng</button>`}
    </div>
    <div class="notice">Cập nhật: ${escapeHtml(updated)}</div>`;

  if (st === 'CHARGING') html += `<div class="notice">Trạm đang phục vụ xe khác. Thông tin phiên sạc được bảo mật.</div>`;
  if (!['AVAILABLE', 'CHARGING'].includes(st)) html += `<div class="notice">Trạm chưa sẵn sàng nhận đăng ký hàng chờ.</div>`;
  if (c?.temporary) html += `<div class="notice">Tọa độ tham khảo, chưa xác minh chính xác.</div>`;

  $('detailBody').innerHTML = html;
  $('detailCard').classList.add('show');
}

function closeDetail() {
  $('detailCard').classList.remove('show');
  selectedId = null;
  renderList();
}

window.selectStation = function(id) {
  selectedId = Number(id);
  const s = stations.find(x => Number(x.id) === selectedId);
  if (!s) return;
  showDetail(s);
  renderList();
  focusStation(id);
  // Làm mới snapshot hàng chờ của mình nếu có
  if (myQueues[String(id)]) refreshMyQueue(id);
};

window.setRouteMode = function(mode) {
  routeMode = mode;
  const s = stations.find(x => Number(x.id) === selectedId);
  if (s) showDetail(s);
  if (userPos && selectedId !== null) requestRoute(selectedId);
};

/* ========== MAP ========== */
function initMap() {
  if (typeof maplibregl === 'undefined') {
    $('map').innerHTML = '<div class="map-fallback"><b>Không tải được MapLibre.</b></div>';
    return;
  }
  map = new maplibregl.Map({
    container: 'map',
    style: MAP_STYLE,
    center: [106.778, 10.865],
    zoom: 12.5
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

  map.on('load', () => {
    mapReady = true;
    map.addSource('route-line', {
      type: 'geojson',
      data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }
    });
    map.addLayer({
      id: 'route-line-layer',
      type: 'line',
      source: 'route-line',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#2563eb', 'line-width': 5, 'line-opacity': 0.85 }
    });
    updateMarkers();
  });
}

function markerColor(s) {
  const st = safeStatus(s);
  if (st === 'AVAILABLE') return '#0b9b70';
  if (st === 'CHARGING')  return '#3478e5';
  if (st === 'FAULT' || st === 'OFFLINE') return '#d14343';
  return '#8a96a8';
}

function createMarkerEl(s) {
  const el = document.createElement('div');
  el.style.cssText = `width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    background:${markerColor(s)};border:3px solid #fff;box-shadow:0 3px 10px #0004;
    display:grid;place-items:center;cursor:pointer;`;
  const span = document.createElement('span');
  span.style.cssText = 'transform:rotate(45deg);color:#fff;font-weight:800;font-size:13px;';
  span.textContent = String(s.id);
  el.appendChild(span);
  return el;
}

function showOverview() {
  selectedId = null;
  $('detailCard').classList.remove('show');
  renderList();
  if (!mapReady) return;

  const bounds = [];
  stations.forEach(s => {
    const c = coordsOf(s);
    if (c) bounds.push([c.lng, c.lat]);
  });
  if (userPos) bounds.push([userPos.lng, userPos.lat]);

  if (bounds.length) {
    const b = new maplibregl.LngLatBounds();
    bounds.forEach(p => b.extend(p));
    map.fitBounds(b, { padding: 56, maxZoom: 14, duration: 800 });
  } else {
    map.flyTo({ center: [106.778, 10.865], zoom: 12.5, duration: 700 });
  }
  Object.values(markers).forEach(m => { try { m.getPopup()?.remove(); } catch (_) {} });
}
window.showOverview = showOverview;

function updateMarkers() {
  if (!mapReady) return;
  Object.values(markers).forEach(m => m.remove());
  markers = {};
  const bounds = [];
  stations.forEach(s => {
    const c = coordsOf(s);
    if (!c) return;
    const el = createMarkerEl(s);
    const marker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
      .setLngLat([c.lng, c.lat])
      .setPopup(new maplibregl.Popup({ offset: 22 }).setHTML(
        `<div class="popname">${escapeHtml(s.name || 'Trạm')}</div>
         <div class="popstatus">${statusInfo(s)[0]}${c.temporary ? ' · tham khảo' : ''}</div>
         <div style="margin-top:5px"><button onclick="selectStation(${Number(s.id)})" style="border:0;background:#2563eb;color:#fff;border-radius:5px;padding:4px 8px;font-size:11px;cursor:pointer">Xem</button></div>`
      ))
      .addTo(map);
    el.addEventListener('click', () => selectStation(s.id));
    markers[s.id] = marker;
    bounds.push([c.lng, c.lat]);
  });
  if (bounds.length && selectedId === null) {
    const b = new maplibregl.LngLatBounds();
    bounds.forEach(p => b.extend(p));
    map.fitBounds(b, { padding: 56, maxZoom: 14 });
  }
}

window.focusStation = function(id) {
  const m = markers[Number(id)];
  if (m && mapReady) {
    map.flyTo({ center: m.getLngLat(), zoom: 15, duration: 700 });
    m.togglePopup();
  }
};

/* ========== GPS ========== */
function updateUserMarker(lat, lng) {
  if (!mapReady) return;
  if (!userMarker) {
    const el = document.createElement('div');
    el.style.cssText = 'width:14px;height:14px;border-radius:50%;background:#2563eb;border:2.5px solid #fff;box-shadow:0 1px 5px #0004;';
    userMarker = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(map);
  } else {
    userMarker.setLngLat([lng, lat]);
  }
}

function onPosition(pos) {
  const { latitude: lat, longitude: lng } = pos.coords;
  userPos = { lat, lng, ts: Date.now() };
  updateUserMarker(lat, lng);
  $('gpsStatus').textContent = watching ? 'GPS theo dõi' : 'GPS đã lấy';
  $('gpsStatus').classList.add('on');
  renderList();
  if (selectedId !== null && shouldRecalculateRoute()) requestRoute(selectedId);
}

function onPositionError() {
  showToast('Không lấy được GPS. Cấp quyền Location và dùng HTTPS.', true);
  $('locateBtn').disabled = false;
  $('locateBtn').textContent = '◎ Vị trí';
  stopWatch();
}

function locateOnce() {
  if (!navigator.geolocation) { showToast('Trình duyệt không hỗ trợ GPS.', true); return; }
  $('locateBtn').disabled = true;
  $('locateBtn').textContent = '…';
  navigator.geolocation.getCurrentPosition(pos => {
    onPosition(pos);
    map.flyTo({ center: [pos.coords.longitude, pos.coords.latitude], zoom: 14.5, duration: 800 });
    $('locateBtn').disabled = false;
    $('locateBtn').textContent = '◎ Vị trí';
  }, onPositionError, { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
}

function startWatch() {
  if (!navigator.geolocation || watching) return;
  watching = true;
  $('watchBtn').textContent = 'Dừng GPS';
  $('watchBtn').classList.remove('outline');
  $('watchBtn').classList.add('secondary');
  $('gpsStatus').textContent = 'GPS theo dõi';
  $('gpsStatus').classList.add('on');
  watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
    enableHighAccuracy: true, timeout: 15000, maximumAge: 5000
  });
}

function stopWatch() {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  watching = false;
  $('watchBtn').textContent = 'Theo dõi GPS';
  $('watchBtn').classList.add('outline');
  $('watchBtn').classList.remove('secondary');
  $('gpsStatus').textContent = userPos ? 'GPS đã lấy' : 'GPS tắt';
  if (!userPos) $('gpsStatus').classList.remove('on');
}

function toggleWatch() { watching ? stopWatch() : startWatch(); }

/* ========== ROUTING ========== */
function shouldRecalculateRoute() {
  if (!userPos || !lastRoutePos) return true;
  const dist = haversineM(userPos.lat, userPos.lng, lastRoutePos.lat, lastRoutePos.lng);
  return dist >= ROUTE_MIN_DIST_M || (Date.now() - lastRouteTs) >= ROUTE_MIN_INTERVAL_MS;
}

async function requestRoute(stationId) {
  const s = stations.find(x => Number(x.id) === Number(stationId));
  if (!s) return;
  const c = coordsOf(s);
  if (!c) { showToast('Trạm chưa có tọa độ.', true); return; }
  if (!userPos) { showToast('Chưa có vị trí. Nhấn “Vị trí” hoặc bật theo dõi GPS.', true); return; }

  const profile = routeMode === 'bike' ? 'bike' : 'driving';
  const url = `${OSRM_BASE}/route/v1/${profile}/${userPos.lng},${userPos.lat};${c.lng},${c.lat}?overview=full&geometries=geojson`;
  const infoEl = $('routeInfo');
  if (infoEl) infoEl.innerHTML = 'Đang tính…';

  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('OSRM HTTP ' + r.status);
    const data = await r.json();
    if (data.code !== 'Ok' || !data.routes?.length) throw new Error(data.message || 'Không tìm thấy đường');

    const route = data.routes[0];
    currentRoute = { distance: route.distance, duration: route.duration, geometry: route.geometry };
    lastRoutePos = { lat: userPos.lat, lng: userPos.lng };
    lastRouteTs = Date.now();

    if (mapReady && map.getSource('route-line')) {
      map.getSource('route-line').setData({ type: 'Feature', geometry: route.geometry });
      const b = new maplibregl.LngLatBounds();
      route.geometry.coordinates.forEach(p => b.extend(p));
      map.fitBounds(b, { padding: 60, maxZoom: 15, duration: 700 });
    }
    if (infoEl) infoEl.innerHTML = `<b>${formatDistance(route.distance)}</b> · <b>${formatDuration(route.duration)}</b>`;
  } catch (e) {
    if (infoEl) infoEl.innerHTML = 'Lỗi tính đường';
    showToast('Không tính được đường: ' + e.message, true);
  }
}
window.requestRoute = requestRoute;

window.openGoogleMaps = function(id) {
  const s = stations.find(x => Number(x.id) === Number(id));
  const c = s && coordsOf(s);
  if (!c) { showToast('Trạm chưa có tọa độ.', true); return; }
  const mode = routeMode === 'bike' ? 'two-wheeler' : 'driving';
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}&travelmode=${mode}`, '_blank', 'noopener');
};

/* ========== QUEUE ========== */
window.joinQueue = async function(id) {
  const s = stations.find(x => Number(x.id) === Number(id));
  if (!s) return;
  const st = safeStatus(s);
  if (!['AVAILABLE', 'CHARGING'].includes(st)) {
    showToast('Trạm chưa sẵn sàng nhận lượt chờ.', true);
    return;
  }
  if (hasActiveQueue(myQueues[String(id)])) {
    showToast('Bạn đã có lượt chờ tại trạm này.');
    return;
  }
  // Allow a new registration after a previous queue has ended.
  if (myQueues[String(id)]) setMyQueue(id, null);
  if (!confirm('Tham gia hàng chờ tại ' + (s.name || 'trạm này') + '?')) return;

  try {
    const r = await fetch(`${API_BASE}/api/user/stations/${id}/queue`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        action: 'JOIN',
        guestId: getGuestId()
      })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || d.success === false) {
      throw new Error(d.message || d.error || ('HTTP ' + r.status));
    }
    const record = queueRecordFromResponse(d);
    const queueId = record.queueId;
    if (!queueId) throw new Error('API chưa trả về mã lượt (queueId/entryId).');
    setMyQueue(id, {
      queueId,
      status: String(record.status || 'WAITING').toUpperCase(),
      position: record.position,
      stationId: Number(id),
      updatedAt: Date.now()
    });
    showToast(d.message || 'Đăng ký hàng chờ thành công.');
    await loadStations();
    const s2 = stations.find(x => Number(x.id) === Number(id));
    if (s2) showDetail(s2);
    startQueuePolling();
  } catch (e) {
    showToast('Chưa thể tham gia: ' + e.message, true);
  }
};

window.cancelQueue = async function(id) {
  const mine = myQueues[String(id)];
  if (!mine || !mine.queueId) {
    showToast('Không tìm thấy lượt chờ để hủy.', true);
    return;
  }
  if (!confirm('Hủy lượt chờ tại trạm này?')) return;

  try {
    const r = await fetch(`${API_BASE}/api/user/stations/${id}/queue`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        action: 'CANCEL',
        guestId: getGuestId(),
        entryId: mine.queueId
      })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || d.success === false) {
      throw new Error(d.message || d.error || ('HTTP ' + r.status));
    }
    setMyQueue(id, {
      ...mine,
      status: 'CANCELLED',
      position: null,
      updatedAt: Date.now()
    });
    showToast(d.message || 'Đã hủy lượt chờ.');
    await loadStations();
    const s2 = stations.find(x => Number(x.id) === Number(id));
    if (s2) showDetail(s2);
  } catch (e) {
    showToast('Không hủy được: ' + e.message, true);
  }
};

async function refreshMyQueue(stationId) {
  const mine = myQueues[String(stationId)];
  if (!mine) return;
  try {
    const url = `${API_BASE}/api/user/stations/${stationId}/queue?guestId=${encodeURIComponent(getGuestId())}`;
    const r = await fetch(url, { headers: { 'Accept': 'application/json' }, cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json().catch(() => ({}));
    if (d.success === false) return;

    const record = queueRecordFromResponse(d);
    // An empty/ambiguous snapshot must not erase a locally known queue.
    const status = String(record.status || mine.status || 'WAITING').toUpperCase();
    const queueId = record.queueId || mine.queueId;
    if (['WAITING', 'CALLED', 'SERVING', 'COMPLETED', 'CANCELLED'].includes(status)) {
      setMyQueue(stationId, {
        queueId,
        status,
        position: record.position ?? mine.position ?? null,
        stationId: Number(stationId),
        updatedAt: Date.now()
      });
    }
    if (selectedId === Number(stationId)) {
      const s = stations.find(x => Number(x.id) === Number(stationId));
      if (s) showDetail(s);
    }
    renderList();
  } catch (_) {}
}

function startQueuePolling() {
  if (queuePollTimer) return;
  queuePollTimer = setInterval(() => {
    const ids = Object.keys(myQueues).filter(id => hasActiveQueue(myQueues[id]));
    if (!ids.length) {
      clearInterval(queuePollTimer);
      queuePollTimer = null;
      return;
    }
    ids.forEach(id => refreshMyQueue(id));
  }, QUEUE_POLL_MS);
}

/* ========== BOOT ========== */
$('refreshBtn').addEventListener('click', loadStations);
$('locateBtn').addEventListener('click', locateOnce);
$('watchBtn').addEventListener('click', toggleWatch);
$('overviewBtn').addEventListener('click', showOverview);
$('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value || '';
  renderList();
});

getGuestId(); // đảm bảo có guestId ngay từ đầu
initMap();
loadStations();
setInterval(loadStations, REFRESH_MS);
if (Object.keys(myQueues).length) startQueuePolling();
</script>
